[pytest]
# Offline tests only: none of these calls a model (tests/conftest.py sets dead
# API keys). The live suites are run_live_suite.py, which only the user runs.
testpaths = tests
# Only test_*.py. tests/notebook_cells/ holds ported notebook cells, some of
# whose names end in _test.py; tests/test_notebook_cells.py runs them.
python_files = test_*.py
